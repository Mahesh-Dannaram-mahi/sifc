name: sipora
description: "A new Flutter project."
publish_to: 'none'
# For and
# version: 1.3.4+25

# For App
version: 1.2.1+6

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.9
  http: ^1.1.0
  http_parser: ^4.0.2
  dart_jsonwebtoken: ^3.4.1
  shared_preferences: ^2.5.5
  provider: ^6.1.2
  url_launcher: ^6.3.0
  package_info_plus: ^10.1.0
  flutter_local_notifications: ^22.0.0
  auto_size_text: ^3.0.0
  shimmer: ^3.0.0

  csv: ^6.0.0
  share_plus: ^13.3.0

# Google Maps & Location
  google_maps_flutter: ^2.17.1
  geolocator: ^14.0.2
  geocoding: ^4.0.0
  permission_handler: ^12.0.3
  razorpay_flutter: ^1.4.5
  connectivity_plus: ^7.1.1
  android_intent_plus: ^6.0.0
  firebase_core: ^4.10.0
  firebase_messaging: ^16.3.0
  device_info_plus: ^13.1.0
  intl: ^0.20.2
  audioplayers: ^6.1.0

# Image packing and caching
  image_picker: ^1.0.7
  cached_network_image: ^3.3.1
  image_cropper: ^8.0.2
  image_cropper_for_web: ^6.0.0
  photo_view: ^0.15.0

  pinput: ^5.0.0
  sms_autofill: ^2.4.1
  fl_chart: ^1.2.0

  # Screen Adaptation
  flutter_screenutil_plus: ^1.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/images/sipora_logo.png
    - assets/sound/payment_sound.mp3
    - pubspec.yaml

# Flutter Launcher Icons configuration
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/sipora_logo.png"
  adaptive_icon_background: "#0C382A"
  adaptive_icon_foreground: "assets/images/sipora_logo.png"
